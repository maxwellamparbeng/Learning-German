<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Beautiful Rounded Squircle Background (iOS/Android Adaptive Style) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Decorative sound waves -->
  <path d="M 140,256 m 0,-40 a 40,40 0 0,1 0,80" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <path d="M 140,256 m 0,-70 a 70,70 0 0,1 0,140" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  
  <path d="M 372,256 m 0,-40 a 40,40 0 0,0 0,80" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <path d="M 372,256 m 0,-70 a 70,70 0 0,0 0,140" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.4" />

  <!-- Mic Stand & Base -->
  <g filter="url(#shadow)">
    <!-- Base -->
    <path d="M 200,380 L 312,380 M 256,330 L 256,380" stroke="#f1f5f9" stroke-width="16" stroke-linecap="round" />
    <!-- U-shaped cradle -->
    <path d="M 190,240 C 190,320 322,320 322,240" fill="none" stroke="#f1f5f9" stroke-width="16" stroke-linecap="round" />
    <!-- Microphone body -->
    <rect x="220" y="140" width="72" height="140" rx="36" fill="url(#micGrad)" stroke="#1e293b" stroke-width="4" />
    <!-- Grille detail -->
    <path d="M 220,195 L 292,195 M 256,140 L 256,195 M 234,155 L 234,195 M 278,155 L 278,195" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <!-- German Accent Ring / Band on mic -->
    <rect x="222" y="225" width="68" height="6" fill="#000000" />
    <rect x="222" y="231" width="68" height="6" fill="#dd0000" />
    <rect x="222" y="237" width="68" height="6" fill="#ffcf00" />
  </g>
</svg>
